<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Colaboradores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Cadastro de Colaboradores</h1>

<section class="card">
    <h2 id="tituloForm">Novo colaborador</h2>

    <form id="formColaborador">
        <input type="hidden" id="id">

        <label>Nome</label>
        <input type="text" id="nome">

        <label>Cargo</label>
        <input type="text" id="cargo">

        <label>Data de admissao</label>
        <input type="date" id="dataAdmissao">

        <label>Departamento</label>
        <select id="departamento">
            <option value="">Sem departamento</option>
        </select>

        <button type="submit">Salvar</button>
        <button type="button" id="btnCancelar">Cancelar</button>
    </form>

    <p id="mensagem"></p>
</section>

<section class="card">
    <h2>Colaboradores</h2>
    <input type="search" id="busca" placeholder="Filtrar por cargo...">

    <table>
        <thead>
        <tr>
            <th>Nome</th>
            <th>Cargo</th>
            <th>Departamento</th>
            <th>Admissao</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="corpoTabela"></tbody>
    </table>
</section>

<script src="app.js"></script>
</body>
</html>
